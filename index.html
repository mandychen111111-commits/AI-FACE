<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇異生技 | AI Skin Analysis (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;700&display=swap');
        
        :root {
            --morandi-gray: #B2B1B1;
            --champagne-gold: #D4AF37;
            --deep-slate: #2C3E50;
            --pearl-white: #FBFCF8;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #E5E7EB; 
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 支援傳統瀏覽器 */
            height: 100vh; 
            /* 現代手機動態視窗高度適配，防止底部被工具列遮擋 */
            height: 100dvh; 
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            background: var(--pearl-white); 
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* 針對桌機/平板的模擬手機外觀設定 */
        @media (min-width: 600px) {
            .phone-container {
                max-height: 850px;
                border-radius: 40px;
            }
        }

        /* 高清即時影像容器 */
        #video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: #000;
            overflow: hidden;
            transition: filter 0.8s ease;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1);
            filter: contrast(1.05) brightness(1.0);
        }

        /* 掃描線與光束 */
        @keyframes scanMove {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(800px); opacity: 0; }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--champagne-gold);
            box-shadow: 0 0 20px 2px var(--champagne-gold), 0 0 40px 5px rgba(212, 175, 55, 0.6);
            z-index: 20;
            display: none;
        }
        .scan-line::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(212, 175, 55, 0.35), transparent);
        }
        .scanning .scan-line {
            display: block;
            animation: scanMove 2.5s ease-in-out infinite;
        }

        /* 固定式呼吸發光點 */
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; box-shadow: 0 0 15px rgba(212, 175, 55, 0.9); }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; box-shadow: 0 0 30px rgba(212, 175, 55, 1); }
        }
        .landmark {
            position: absolute;
            width: 12px; 
            height: 12px;
            background: var(--champagne-gold);
            border: 2px solid #FFF; 
            border-radius: 50%;
            z-index: 25;
            display: none; 
        }
        .scanning .landmark {
            display: block;
            animation: pulse 1.5s infinite;
        }

        /* 臉部引導定位框 */
        .face-frame {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; 
            height: 320px; 
            border: 3px dashed rgba(212, 175, 55, 0.9); 
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.4); 
            border-radius: 110px 110px 100px 100px;
            z-index: 15;
            display: none;
            transition: opacity 0.5s ease;
        }
        .scanning .face-frame { display: block; opacity: 0.8; }
        .ar-results-active .face-frame { display: none; } /* 顯示結果時隱藏框線 */

        /* --- 新增：AR 臉頰紫色追蹤區塊 (SVG) --- */
        .ar-zone-svg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px;
            height: 320px;
            z-index: 18;
            pointer-events: none;
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .scanning .ar-zone-svg { display: block; opacity: 0.6; }
        .ar-results-active .ar-zone-svg { display: block; opacity: 0.9; }

        /* --- 新增：AR 分數徽章與彈出動畫 --- */
        @keyframes popIn {
            0% { transform: scale(0.5) translateY(20px); opacity: 0; }
            70% { transform: scale(1.1) translateY(-5px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .badge-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
        }

        .ar-badge-container {
            position: absolute;
            /* 將徽章位置稍微調高，避免手機窄螢幕重疊 */
            bottom: 130px;
            left: 0;
            width: 100%;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            z-index: 40;
            pointer-events: none;
        }

        .ar-score-circle {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border: 3px solid;
        }

        /* --- 懸浮膚質標籤 --- */
        .ar-pill {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            z-index: 40;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s ease, top 0.5s ease;
            pointer-events: none;
        }
        /* 調整結果狀態位置 */
        .ar-results-active .ar-pill { opacity: 1; top: 50%; }

        /* 全頁式報告樣式 */
        #report-page {
            position: absolute;
            inset: 0;
            background: var(--pearl-white);
            z-index: 60;
            overflow-y: auto;
            overflow-x: hidden;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--deep-slate);
            display: flex;
            flex-direction: column; 
        }
        #report-page.active { transform: translateY(0); }
        #report-page::-webkit-scrollbar { width: 0px; background: transparent; }

        .glass-panel {
            background: rgba(251, 252, 248, 0.85); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .btn-gold {
            background: var(--champagne-gold);
            color: white;
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.2);
        }

        .custom-modal {
            position: absolute;
            inset: 0;
            background: rgba(44, 62, 80, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .custom-modal.active { opacity: 1; pointer-events: auto; }
        .custom-modal-content {
            background: var(--pearl-white);
            border: 1px solid var(--morandi-gray);
            padding: 28px 24px;
            border-radius: 24px;
            text-align: center;
            color: var(--deep-slate);
            width: 75%;
            max-width: 320px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }
        .custom-modal.active .custom-modal-content { transform: translateY(0); }
    </style>
</head>
<body>

    <div class="phone-container" id="app">
        <!-- === 第一頁：相機與 AR 掃描介面 === -->
        <div id="camera-view" class="absolute inset-0 z-10 transition-opacity duration-500">
            <div id="video-container">

            </svg>

            <div class="landmark" style="top: 44%; left: 42%;"></div> 
            <div class="landmark" style="top: 44%; left: 58%;"></div> 
            <div class="landmark" style="top: 53%; left: 50%;"></div> 
            <div class="landmark" style="top: 64%; left: 50%;"></div>

            <div id="ar-skin-pill" class="ar-pill">

                    <p class="text-lg font-bold text-[#2C3E50]" id="ar-skin-type-text">分析中</p>
                </div>
            </div>

            <!-- 五大維度 AR 徽章 -->
            <div id="ar-badges" class="ar-badge-container hidden">
                <!-- 動態注入的 5 個圓圈 -->
            </div>

            <!-- AR 畫面進入報告頁的按鈕 (加上 pb-safe 確保安全區域) -->
            <div id="ar-action-btn" class="absolute bottom-0 left-0 w-full p-6 pb-8 z-40 hidden badge-pop" style="animation-delay: 1s;">

                    查看完整專屬報告
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </button>
            </div>

            <!-- UI 頂部狀態 -->

            <!-- 初始引導視窗 -->

                <div class="w-14 h-14 bg-[#FBFCF8] border border-[#D4AF37]/30 rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-12 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <h2 class="text-xl font-medium mb-3 tracking-wide text-[#2C3E50]">啟動美肌觀察儀</h2>

                    <button onclick="shareResult()" class="w-2/3 bg-[#D4AF37] text-white py-3.5 rounded-2xl text-xs font-bold tracking-wide shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">

                        複製分享報告
                    </button>
                </div>
                <div class="h-16 w-full flex-shrink-0"></div>
            </div>
        </div>

        <div id="custom-modal" class="custom-modal">
            <div class="custom-modal-content">
                <div class="w-12 h-12 bg-[#FBFCF8] border border-[#D4AF37]/30 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">

            </div>
        </div>
    </div>

            "敏弱肌膚": {
                need: "穩定屏障與舒緩", desc: "觀察到肌膚屏障較為脆弱，且環境溫差可能引發不適。建議簡化保養步驟，使用多肽成分提升肌膚穩定度與含水量。",
                products: [{ step: "淨化毛孔", name: "海洋元素卸妝水 / 舒張金萃蜜凍" }, { step: "基礎保養", name: "海洋多肽洗顏膠 / 修護奇肌凝膜(保濕款) / 玫瑰Q彈化妝水 / 玫瑰淨磁極緻水" }, { step: "胜肽外泌體", name: "覺醒胜肽2 / 賦活胜肽3 / 海茴香植泌素精萃" }, { step: "深層保養", name: "海茴香外泌體調理精華 / 海洋晶研C晶露" }, { step: "循環導入", name: "金鑽頂級全效精華霜 / 尖端深層循環棒 / 煥醒賦活面膜" }, { step: "修護隔離", name: "賦活水凝晶露 / 海洋元素CC霜" }]
            },
            "乾性肌膚": {
                need: "深層潤澤與鎖水", desc: "分析顯示肌膚含水量偏低，容易產生乾燥紋理。建議加強深層潤澤與油水補充，恢復肌膚應有的彈潤光澤。",
                products: [{ step: "淨化毛孔", name: "海洋元素卸妝水 / 舒張金萃蜜凍" }, { step: "基礎保養", name: "海洋多肽洗顏膠 / 肌能煥膚精華 / 玫瑰Q彈化妝水 / 青萃淨化精華液" }, { step: "胜肽外泌體", name: "覺醒胜肽2 / 賦活胜肽3 / 海茴香植泌素精萃" }, { step: "深層保養", name: "海茴香外泌體調理精華 / 海洋晶研C晶露" }, { step: "循環導入", name: "金鑽頂級全效精華霜 / 尖端深層循環棒 / 煥醒賦活面膜" }, { step: "修護隔離", name: "晶鑽煥采精華 / 海洋元素煥顏霜 / 海洋元素CC霜" }]
            },
            "熟齡肌膚": {
                need: "賦活緊緻與抗老", desc: "針對肌膚彈性支持度變化，建議選用富含外泌體與胜肽之產品，提供全方位賦活能量，落實最美好生活保養哲學。",
                products: [{ step: "淨化毛孔", name: "海洋元素卸妝水 / 舒張金萃蜜凍" }, { step: "基礎保養", name: "海洋多肽洗顏膠 / 肌能煥膚精華 / 玫瑰Q彈化妝水 / 青萃淨化精華液" }, { step: "胜肽外泌體", name: "海茴香植泌素精華 / 覺醒胜肽2 / 賦活胜肽3" }, { step: "深層保養", name: "海茴香外泌體調理精華 / 海洋晶研C晶露" }, { step: "循環導入", name: "金鑽頂級全效精華霜 / 尖端深層循環棒 / 煥醒賦活面膜" }, { step: "修護隔離", name: "晶鑽煥采精華 / 海洋元素煥顏霜 / C-SKIN水晶微雕 / 海洋元素CC霜" }]
            }
        };

        // 合規的美妝養護指標維度
        const arMetrics = [
            { name: "澄淨度", color: "#06b6d4" }, 
            { name: "平滑度", color: "#10b981" }, 
            { name: "緊緻度", color: "#a855f7" }, 
            { name: "眼周亮采", color: "#3b82f6" }, 
            { name: "潤澤度", color: "#f43f5e" }  
        ];

        const video = document.getElementById('webcam');
        const appContainer = document.getElementById('app');
        let streamActive = false;
        
        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function initCameraAndAnalysis() {
            if (!streamActive) {
                const btn = document.getElementById('start-btn');
                btn.innerHTML = `<span class="animate-pulse">啟動感測器中...</span>`;
                
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false 
                    });
                    video.srcObject = stream;
                    streamActive = true;
                    startAnalysisUI();
                } catch (err) {
                    if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                        showModal("鏡頭被其他 App 佔用中。\n請關閉相機或通訊軟體視訊後重試。");
                    } else {
                        showModal("無法存取相機。\n請確認瀏覽器已允許相機權限設定。");
                    }
                    btn.innerHTML = `開啟鏡頭掃描`;
                }
            } else {
                startAnalysisUI();
            }
        }

        function startAnalysisUI() {
            const cameraView = document.getElementById('camera-view');
            const reportPage = document.getElementById('report-page');
            const gpsModal = document.getElementById('gps-modal');
            const statusText = document.getElementById('main-status');
            const scanTips = document.getElementById('scanning-status');
            const stepText = document.getElementById('scan-step-text');
            
            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            gpsModal.classList.add('opacity-0', 'pointer-events-none');
            appContainer.classList.remove('ar-results-active');
            document.getElementById('ar-badges').classList.add('hidden');
            document.getElementById('ar-action-btn').classList.add('hidden');
            
            setTimeout(() => {
                statusText.innerText = '請將臉部對準光圈'; 
                appContainer.classList.remove('results-active');
                appContainer.classList.add('scanning');
                scanTips.classList.remove('hidden');
            }, 500);

            const steps = [
                "啟動微觀肌膚紋理觀察...",
                "正在抓取區域氣象與紫外線指數...",
                "鎖定核心部位養護節點...",
                "比對奇異生技護理資料庫...",
                "綜合評估：產出專屬防禦配方..."
            ];
            
            let stepIdx = 0;
            const stepInterval = setInterval(() => {
                if (stepIdx < steps.length) {
                    stepText.innerText = steps[stepIdx];
                    stepIdx++;
                }
            }, 1200);

            setTimeout(() => {
                clearInterval(stepInterval);
                appContainer.classList.remove('scanning');
                appContainer.classList.add('ar-results-active');
                statusText.innerText = '觀察完成';
                scanTips.classList.add('hidden');
                
                generateARResults();
            }, 6000);
        }

        function generateARResults() {
            const skinTypes = Object.keys(chiyibioDatabase);
            const detectedType = skinTypes[Math.floor(Math.random() * skinTypes.length)];
            const skinData = chiyibioDatabase[detectedType];

            document.getElementById('ar-skin-type-text').innerText = detectedType;
            document.getElementById('report-skin-type').innerText = detectedType;
            document.getElementById('report-skin-need').innerText = skinData.need;
            document.getElementById('report-skin-desc').innerText = skinData.desc;

            const badgesContainer = document.getElementById('ar-badges');
            badgesContainer.innerHTML = ''; 
            badgesContainer.classList.remove('hidden');

            arMetrics.forEach((metric, index) => {
                const score = Math.floor(Math.random() * (98 - 75 + 1)) + 75; 
                const badgeHTML = `
                    <div class="flex flex-col items-center gap-1 badge-pop" style="animation-delay: ${index * 0.15}s;">
                        <div class="ar-score-circle" style="border-color: ${metric.color};">
                            <span class="text-[20px] font-bold text-gray-800 leading-none">${score}</span>
                        </div>
                        <span class="text-[10px] text-white font-bold drop-shadow-md">${metric.name}</span>
                    </div>
                `;
                badgesContainer.insertAdjacentHTML('beforeend', badgeHTML);
            });

            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = ''; 
            skinData.products.forEach((prod, index) => {
                const productHtml = `
                    <div class="bg-white border border-[#B2B1B1]/30 rounded-2xl p-4 flex gap-4 items-center shadow-sm">
                        <div class="w-8 h-8 rounded-full bg-[#D4AF37] flex items-center justify-center text-white font-bold text-xs shadow-md flex-shrink-0">${index + 1}</div>
                        <div>
                            <p class="text-[10px] text-[#D4AF37] uppercase tracking-wider mb-1 font-bold">${prod.step}</p>
                            <p class="text-xs text-[#2C3E50] font-semibold leading-relaxed">${prod.name}</p>
                        </div>
                    </div>
                `;
                productContainer.insertAdjacentHTML('beforeend', productHtml);
            });

            const actionBtn = document.getElementById('ar-action-btn');
            actionBtn.classList.remove('hidden');
            actionBtn.style.animation = 'none';
            actionBtn.offsetHeight; 
            actionBtn.style.animation = null; 
        }

        function showFullReport() {
            const cameraView = document.getElementById('camera-view');
            const reportPage = document.getElementById('report-page');
            
            cameraView.classList.add('opacity-0', 'pointer-events-none');
            reportPage.classList.add('active');
            reportPage.scrollTop = 0;
        }

        function retest() {
            const reportPage = document.getElementById('report-page');
            const cameraView = document.getElementById('camera-view');
            const statusText = document.getElementById('main-status');
            
            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            statusText.innerText = '系統重置中';
            
            setTimeout(() => {
                startAnalysisUI();
            }, 600);
        }

        function shareResult() {
            const skinType = document.getElementById('report-skin-type').innerText;
            const skinNeed = document.getElementById('report-skin-need').innerText;
            const skinData = chiyibioDatabase[skinType];
            let productsText = "";
            if (skinData && skinData.products) {
                skinData.products.forEach((prod, index) => {
                    productsText += `✨ 步驟 ${index + 1}：${prod.step}\n👉 推薦選用：${prod.name}\n\n`;
                });
            }
            const shareText = `【奇異生技 AI 智慧美肌顧問】\n\n我的微觀偵測結果：${skinType}\n核心養護訴求：${skinNeed}\n\n=== 專屬肌膚養護建議 ===\n\n${productsText}🌿 體驗專屬您的科技美肌方案，落實「最美好生活」保養哲學！`;
            
            const textArea = document.createElement("textarea");
            textArea.value = shareText;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showModal("專屬養護報告已成功複製！\n您可以直接貼上並分享給好友，或儲存至備忘錄。");
            } catch (err) {
                showModal("複製失敗，請確認瀏覽器權限設定。");
            } finally {
                document.body.removeChild(textArea);
            }
        }
    </script>
</body>
