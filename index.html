<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇異生技 | AI Skin Analysis (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap');
        
        :root {
            --morandi-gray: #B2B1B1;
            --champagne-gold: #D4AF37;
            --deep-slate: #2C3E50;
            --pearl-white: #FBFCF8;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 高清即時影像容器 */
        #video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: #000;
            overflow: hidden; /* 防止溢出 */
            transition: filter 0.8s ease;
        }

        /* 強制影片填滿的終極寫法 */
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1); /* 置中並加上鏡像效果 */
            filter: contrast(1.05) brightness(1.0);
        }

        /* 當結果顯示時，僅輕微暗化背景，不使用模糊 */
        .results-active #video-container {
            filter: brightness(0.4);
        }

        /* 掃描線動畫 */
        @keyframes scanMove {
            0% { transform: translateY(-100%); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(800px); opacity: 0; }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
            box-shadow: 0 0 25px var(--champagne-gold);
            z-index: 20;
            display: none;
        }
        .scanning .scan-line {
            display: block;
            animation: scanMove 3s ease-in-out infinite;
        }

        /* 呼吸發光點 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 20px var(--champagne-gold); }
        }
        .landmark {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--champagne-gold);
            border-radius: 50%;
            z-index: 25;
            display: none;
            border: 2px solid white;
        }
        .scanning .landmark, .results-active .landmark {
            display: block;
            animation: pulse 2s infinite;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B8972F 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .face-frame {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 380px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 140px 140px 120px 120px;
            z-index: 15;
            display: none;
        }
        .scanning .face-frame { display: block; }

        /* 自訂訊息彈窗樣式 */
        .custom-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .custom-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-modal-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 28px 24px;
            border-radius: 24px;
            text-align: center;
            color: white;
            width: 75%;
            max-width: 320px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .custom-modal.active .custom-modal-content {
            transform: translateY(0);
        }
    </style>
</head>

        let streamActive = false;
        
        // 系統安全訊息彈窗控制
        function showModal(msg) {

            document.getElementById('custom-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function initCameraAndAnalysis() {
            if (!streamActive) {
                try {
                    // 加入 aspectRatio 參數，引導手機相機輸出直向畫面
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'user',
                            aspectRatio: { ideal: window.innerHeight / window.innerWidth }
                        }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    streamActive = true;
                    startAnalysisUI();
                } catch (err) {
                    console.error("相機開啟失敗: ", err);
                    showModal("無法存取相機。\n請授權相機權限以體驗 AI 鏡頭掃描。");
                }
            } else {
                startAnalysisUI();
            }
        }

        function startAnalysisUI() {
            const app = document.getElementById('app');
            const gpsModal = document.getElementById('gps-modal');
            const statusText = document.getElementById('main-status');
            const locationText = document.getElementById('location-text');
            const scanTips = document.getElementById('scanning-status');
            const stepText = document.getElementById('scan-step-text');

            gpsModal.classList.add('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                locationText.innerText = '高雄市, 苓雅區';
                statusText.innerText = '正在進行微觀偵測';
                app.classList.remove('results-active');
                app.classList.add('scanning');
                scanTips.classList.remove('hidden');
                document.getElementById('result-panel').classList.add('hidden');
            }, 500);

            const steps = [
                "正在定位臉部核心養護區...",
                "環境因子數據同步中...",
                "比對奇異生技護理資料庫...",
                "優化專屬養護配方建議中..."
            ];
            
            let stepIdx = 0;
            const stepInterval = setInterval(() => {
                if (stepIdx < steps.length) {
                    stepText.innerText = steps[stepIdx];
                    stepIdx++;
                }
            }, 1200);

            setTimeout(() => {
                clearInterval(stepInterval);
                app.classList.remove('scanning');
                app.classList.add('results-active');
                statusText.innerText = '分析完成';
                scanTips.classList.add('hidden');
                
                // 動態生成分析結果與產品推薦
                generateResult();
                
                document.getElementById('result-panel').classList.remove('hidden');
            }, 5000);
        }

        // 動態產生分析結果的邏輯
        function generateResult() {
            // 取得所有膚質類型鍵值
            const skinTypes = Object.keys(chiyibioDatabase);
            // 模擬 AI 分析：隨機抽取一種膚質 (實務上可串接真實影像辨識 API)
            const detectedType = skinTypes[Math.floor(Math.random() * skinTypes.length)];
            const skinData = chiyibioDatabase[detectedType];

            // 更新 UI 文案
            document.getElementById('detected-skin-type').innerText = detectedType;
            document.getElementById('detected-skin-need').innerText = skinData.need;
            document.getElementById('skin-desc').innerText = skinData.desc;

            // 動態生成產品清單
            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = ''; // 清空先前的結果

            skinData.products.forEach((prod, index) => {
                const productHtml = `
                    <div class="flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50 transition-colors">
                        <div class="w-8 h-8 rounded-full bg-[#D4AF37]/10 flex items-center justify-center text-[#D4AF37] font-bold text-[10px] flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div>
                            <p class="text-[9px] text-gray-400 mb-0.5">${prod.step}</p>
                            <p class="text-xs text-gray-800 font-medium leading-tight">${prod.name}</p>
                        </div>
                    </div>
                `;
                productContainer.insertAdjacentHTML('beforeend', productHtml);
            });
        }

        // 重新檢測功能
        function retest() {
            const app = document.getElementById('app');
            const resultPanel = document.getElementById('result-panel');
            const statusText = document.getElementById('main-status');
            
            // 隱藏結果，回復初始分析狀態
            resultPanel.classList.add('hidden');
            app.classList.remove('results-active');
            statusText.innerText = '系統重置中';
            
            // 短暫延遲後自動啟動新的一輪掃描
            setTimeout(() => {
                startAnalysisUI();
            }, 600);
        }

        // 安全複製分享功能 (已整合專屬肌膚養護建議)
        function shareResult() {
            const skinType = document.getElementById('detected-skin-type').innerText;
            const skinNeed = document.getElementById('detected-skin-need').innerText;
            
            // 讀取資料庫中的產品推薦清單
            const skinData = chiyibioDatabase[skinType];
            let productsText = "";
            
            if (skinData && skinData.products) {
                skinData.products.forEach((prod, index) => {
                    productsText += `✨ 步驟 ${index + 1}：${prod.step}\n👉 推薦選用：${prod.name}\n\n`;
                });
            }
            
            // 組合符合法規且具備品牌溫度的分享文案
            const shareText = `【奇異生技 AI 智慧美肌顧問】\n\n我的微觀偵測結果：${skinType}\n核心養護訴求：${skinNeed}\n\n=== 專屬肌膚養護建議 ===\n\n${productsText}🌿 體驗專屬您的科技美肌方案，落實「最美好生活」保養哲學！`;
            
            // 使用傳統且最安全的 execCommand 確保不被系統阻擋
            const textArea = document.createElement("textarea");
            textArea.value = shareText;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showModal("專屬養護報告已成功複製！\n您可以直接貼上並分享給好友，或儲存至備忘錄。");
            } catch (err) {
                showModal("複製失敗，請確認瀏覽器權限設定。");
            } finally {
                document.body.removeChild(textArea);
            }
        }
    </script>
</body>
</html>
