<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇異生技 | AI Skin Analysis (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap');
        
        :root {
            --morandi-gray: #B2B1B1;
            --champagne-gold: #D4AF37;
            --deep-slate: #2C3E50;
            --pearl-white: #FBFCF8;
            --bg-dark: #0a0a0a;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 高清即時影像容器 */
        #video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: #000;
            overflow: hidden;
            transition: filter 0.8s ease;
        }

        /* 強制影片填滿 */
        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1);
            filter: contrast(1.05) brightness(1.0);
        }

        /* 掃描線動畫 */
        @keyframes scanMove {
            0% { transform: translateY(-100%); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(800px); opacity: 0; }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--champagne-gold), transparent);
            box-shadow: 0 0 25px var(--champagne-gold);
            z-index: 20;
            display: none;
        }
        .scanning .scan-line {
            display: block;
            animation: scanMove 3s ease-in-out infinite;
        }

        /* 呼吸發光點 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 20px var(--champagne-gold); }
        }
        .landmark {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--champagne-gold);
            border-radius: 50%;
            z-index: 25;
            display: none;
            border: 2px solid white;
        }
        .scanning .landmark {
            display: block;
            animation: pulse 2s infinite;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B8972F 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .face-frame {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 380px;
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 140px 140px 120px 120px;
            z-index: 15;
            display: none;
        }
        .scanning .face-frame { display: block; }

        /* --- 全頁式報告樣式 --- */
        #report-page {
            position: absolute;
            inset: 0;
            background: var(--bg-dark);
            z-index: 60;
            overflow-y: auto;
            overflow-x: hidden;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: white;
            display: flex;
            flex-col;
        }
        #report-page.active {
            transform: translateY(0);
        }
        
        /* 隱藏卷軸但保持可滾動 */
        #report-page::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 自訂訊息彈窗樣式 */
        .custom-modal {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .custom-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-modal-content {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 28px 24px;
            border-radius: 24px;
            text-align: center;
            color: white;
            width: 75%;
            max-width: 320px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .custom-modal.active .custom-modal-content {
            transform: translateY(0);
        }
    </style>
</head>

    </div>

        const video = document.getElementById('webcam');
        let streamActive = false;
        
        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function initCameraAndAnalysis() {
            if (!streamActive) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { 
                            facingMode: 'user',
                            aspectRatio: { ideal: window.innerHeight / window.innerWidth }
                        }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    streamActive = true;
                    startAnalysisUI();
                } catch (err) {
                    console.error("相機開啟失敗: ", err);
                    showModal("無法存取相機。\n請授權相機權限以體驗 AI 鏡頭掃描。");
                }
            } else {
                startAnalysisUI();
            }
        }

            const gpsModal = document.getElementById('gps-modal');
            const statusText = document.getElementById('main-status');
            const locationText = document.getElementById('location-text');
            const scanTips = document.getElementById('scanning-status');
            const stepText = document.getElementById('scan-step-text');

            // 隱藏報告頁面與彈窗
            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            gpsModal.classList.add('opacity-0', 'pointer-events-none');
            
            setTimeout(() => {
                locationText.innerText = '高雄市, 苓雅區';
                statusText.innerText = '正在進行微觀偵測';
                app.classList.remove('results-active');
                app.classList.add('scanning');
                scanTips.classList.remove('hidden');
            }, 500);

            // 更新為精細化互動文案
            const steps = [
                "AI 臉部輪廓精準定位中...",
                "正在觀察肌膚紋理與細緻度...",
                "鎖定 T 字部位與 U 字部位養護節點...",
                "環境分析：抓取氣象與紫外線指數...",
                "綜合評估：根據在地環境優化養護配方..."
            ];
            
            let stepIdx = 0;
            const stepInterval = setInterval(() => {
                if (stepIdx < steps.length) {
                    stepText.innerText = steps[stepIdx];
                    stepIdx++;
                }
            }, 1200);

            setTimeout(() => {
                clearInterval(stepInterval);
                app.classList.remove('scanning');
                statusText.innerText = '掃描完成';
                scanTips.classList.add('hidden');
                
                // 生成資料庫內容
                generateResult();
                
                // 轉場進入全頁報告
                setTimeout(() => {
                    cameraView.classList.add('opacity-0', 'pointer-events-none');
                    reportPage.classList.add('active');
                    // 滾動回頂部
                    reportPage.scrollTop = 0;
                }, 300);

            }, 6000);
        }

        function generateResult() {
            const skinTypes = Object.keys(chiyibioDatabase);
            const detectedType = skinTypes[Math.floor(Math.random() * skinTypes.length)];
            const skinData = chiyibioDatabase[detectedType];

            document.getElementById('detected-skin-type').innerText = detectedType;
            document.getElementById('detected-skin-need').innerText = skinData.need;
            document.getElementById('skin-desc').innerText = skinData.desc;

            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = ''; 

            skinData.products.forEach((prod, index) => {
                const productHtml = `
                    <div class="bg-white/5 border border-white/10 rounded-2xl p-4 flex gap-4 items-center">
                        <div class="w-8 h-8 rounded-full bg-[#D4AF37] flex items-center justify-center text-white font-bold text-xs shadow-lg flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div>
                            <p class="text-[10px] text-[#D4AF37] uppercase tracking-wider mb-1 font-semibold">${prod.step}</p>
                            <p class="text-xs text-gray-200 font-medium leading-relaxed">${prod.name}</p>
                        </div>
                    </div>
                `;
                productContainer.insertAdjacentHTML('beforeend', productHtml);
            });
        }

        function retest() {
            const reportPage = document.getElementById('report-page');
            const cameraView = document.getElementById('camera-view');
            const statusText = document.getElementById('main-status');
            
            // 報告向下滑出，相機畫面淡入
            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            statusText.innerText = '系統重置中';
            
            setTimeout(() => {
                startAnalysisUI();
            }, 600);
        }

        function shareResult() {
            const skinType = document.getElementById('detected-skin-type').innerText;
            const skinNeed = document.getElementById('detected-skin-need').innerText;
            const skinData = chiyibioDatabase[skinType];
            let productsText = "";
            
            if (skinData && skinData.products) {
                skinData.products.forEach((prod, index) => {
                    productsText += `✨ 步驟 ${index + 1}：${prod.step}\n👉 推薦選用：${prod.name}\n\n`;
                });
            }
            
            const shareText = `【奇異生技 AI 智慧美肌顧問】\n\n我的微觀偵測結果：${skinType}\n核心養護訴求：${skinNeed}\n\n=== 專屬肌膚養護建議 ===\n\n${productsText}🌿 體驗專屬您的科技美肌方案，落實「最美好生活」保養哲學！`;
            
            const textArea = document.createElement("textarea");
            textArea.value = shareText;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showModal("專屬養護報告已成功複製！\n您可以直接貼上並分享給好友，或儲存至備忘錄。");
            } catch (err) {
                showModal("複製失敗，請確認瀏覽器權限設定。");
            } finally {
                document.body.removeChild(textArea);
            }
        }
    </script>
</body>
</html>
