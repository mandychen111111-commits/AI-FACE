<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇異生技 | AI Skin Analysis (Pro)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 導入 Google MediaPipe AI 臉部追蹤引擎 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&display=swap');
        
        :root {
            --morandi-gray: #B2B1B1;
            --champagne-gold: #D4AF37;
            --deep-slate: #2C3E50;
            --pearl-white: #FBFCF8;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: #E5E7EB; 
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background: var(--pearl-white); 
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        /* 高清即時影像容器 */
        #video-container {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: #000;
            overflow: hidden;
            transition: filter 0.8s ease;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            object-fit: cover;
            transform: translate(-50%, -50%) scaleX(-1);
            filter: contrast(1.05) brightness(1.0);
        }

        /* --- 強化版掃描線與光束 --- */
        @keyframes scanMove {
            0% { transform: translateY(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(800px); opacity: 0; }
        }
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--champagne-gold);
            box-shadow: 0 0 20px 2px var(--champagne-gold), 0 0 40px 5px rgba(212, 175, 55, 0.6);
            z-index: 20;
            display: none;
        }
        .scan-line::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            height: 120px;
            background: linear-gradient(to top, rgba(212, 175, 55, 0.35), transparent);
        }
        .scanning .scan-line {
            display: block;
            animation: scanMove 2.5s ease-in-out infinite;
        }

        /* --- 即時動態呼吸發光點 --- */
        @keyframes pulse {
            0%, 100% { transform: scale(1) translate(-50%, -50%); box-shadow: 0 0 10px rgba(212, 175, 55, 0.8); }
            50% { transform: scale(1.6) translate(-30%, -30%); box-shadow: 0 0 25px rgba(212, 175, 55, 1); }
        }
        .landmark {
            position: absolute;
            width: 8px; 
            height: 8px;
            background: var(--champagne-gold);
            border-radius: 50%;
            z-index: 25;
            opacity: 0; /* 預設隱藏，抓到臉才顯示 */
            /* 加入過渡動畫讓追蹤更平滑，不抖動 */
            transition: top 0.1s linear, left 0.1s linear, opacity 0.3s ease;
        }
        .scanning .landmark.active {
            opacity: 1;
            animation: pulse 1.5s infinite;
        }

        /* 明亮透白質感的毛玻璃面板 */
        .glass-panel {
            background: rgba(251, 252, 248, 0.85); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            color: var(--deep-slate); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .btn-gold {
            background: var(--champagne-gold);
            color: white;
            box-shadow: 0 8px 15px rgba(212, 175, 55, 0.2);
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 臉部引導定位框 --- */
        .face-frame {
            position: absolute;
            top: 50%; 
            left: 50%;
            transform: translate(-50%, -50%);
            width: 220px; 
            height: 320px; 
            border: 2px dashed rgba(212, 175, 55, 0.5); 
            border-radius: 110px 110px 100px 100px;
            z-index: 15;
            display: none;
            transition: opacity 0.5s ease;
        }
        .scanning .face-frame { display: block; }
        .scanning .face-frame.face-detected { opacity: 0.2; } /* 抓到臉後變淡，凸顯追蹤點 */

        /* 全頁式報告樣式 */
        #report-page {
            position: absolute;
            inset: 0;
            background: var(--pearl-white);
            z-index: 60;
            overflow-y: auto;
            overflow-x: hidden;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--deep-slate);
            display: flex;
            flex-direction: column; 
        }
        #report-page.active {
            transform: translateY(0);
        }
        
        #report-page::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 系統彈窗 */
        .custom-modal {
            position: absolute;
            inset: 0;
            background: rgba(44, 62, 80, 0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .custom-modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-modal-content {
            background: var(--pearl-white);
            border: 1px solid var(--morandi-gray);
            padding: 28px 24px;
            border-radius: 24px;
            text-align: center;
            color: var(--deep-slate);
            width: 75%;
            max-width: 320px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        .custom-modal.active .custom-modal-content {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="phone-container" id="app">
        <!-- === 第一頁：相機與掃描介面 === -->
        <div id="camera-view" class="absolute inset-0 z-10 transition-opacity duration-500">
            <!-- 即時高清相機視窗 -->
            <div id="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <!-- 保留四周暗化光暈，使中間聚焦且金線高對比 -->
                <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,transparent_30%,rgba(0,0,0,0.6)_100%)]"></div>
            </div>

            <!-- 掃描層 -->
            <div class="scan-line"></div>
            <div class="face-frame" id="face-guide"></div>
            
            <!-- 即時動態特徵點 (交由 AI 控制座標) -->
            <div class="landmark" id="pt-forehead"></div> 
            <div class="landmark" id="pt-left-eye"></div> 
            <div class="landmark" id="pt-right-eye"></div> 
            <div class="landmark" id="pt-nose"></div> 
            <div class="landmark" id="pt-chin"></div> 

            <!-- UI 頂部狀態 -->

                <div class="text-[#FBFCF8]">
                    <p class="text-[9px] tracking-[0.3em] uppercase text-[#B2B1B1] font-bold drop-shadow-md">CHIYIBIO INTELLIGENCE</p>
                    <h1 class="text-lg font-medium drop-shadow-md" id="main-status">系統待命</h1>
                </div>
                <div class="text-right text-[#FBFCF8]">
                    <p class="text-[10px] text-[#B2B1B1] font-medium drop-shadow-md" id="time-display"></p>
                    <p class="text-[10px] text-[#D4AF37] font-bold drop-shadow-md" id="location-text">等待定位...</p>
                </div>
            </div>

            <!-- 初始引導視窗 -->
            <div id="gps-modal" class="absolute inset-x-8 top-1/2 -translate-y-1/2 glass-panel p-8 rounded-[40px] text-center z-40 transition-all duration-500">
                <div class="w-14 h-14 bg-[#FBFCF8] border border-[#D4AF37]/30 rounded-2xl flex items-center justify-center mx-auto mb-6 rotate-12 shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                </div>
                <h2 class="text-xl font-medium mb-3 tracking-wide text-[#2C3E50]">啟動美肌觀察儀</h2>
                <p class="text-xs text-[#B2B1B1] leading-relaxed mb-8 px-2 font-medium">
                    我們將透過即時 AI 臉部追蹤與環境定位，為您量身打造專屬養護建議。
                </p>
                <button id="start-btn" onclick="initCameraAndAnalysis()" class="w-full btn-gold py-4 rounded-2xl text-xs font-bold tracking-[0.1em] uppercase active:scale-95 transition-all">
                    開啟鏡頭掃描
                </button>
            </div>

            <!-- 掃描中文字提示 -->
            <div id="scanning-status" class="absolute bottom-24 w-full text-center hidden z-30 pointer-events-none">
                <p class="text-[#D4AF37] text-[10px] tracking-[0.2em] font-bold uppercase mb-2 animate-pulse drop-shadow-md" id="scan-step-text">正在初始化感測器...</p>
                <div class="w-32 h-[1px] bg-[#B2B1B1]/30 mx-auto overflow-hidden">
                    <div class="h-full bg-[#D4AF37] w-1/2 animate-[shimmer_2s_infinite]"></div>
                </div>
            </div>
        </div>

        <!-- === 第二頁：全頁式專屬報告 === -->
        <div id="report-page" class="flex flex-col">
            <!-- 報告頂部橫幅 (海洋風格) -->
            <div class="relative w-full h-48 bg-gradient-to-b from-[#D4AF37]/10 to-[#FBFCF8] flex-shrink-0 border-b border-[#B2B1B1]/20">
                <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1488188840666-e2308741a62f?auto=format&fit=crop&q=80&w=800')] bg-cover bg-center opacity-15 mix-blend-multiply"></div>
                <div class="absolute bottom-6 left-6 right-6">
                    <p class="text-[10px] text-[#B2B1B1] tracking-[0.2em] uppercase font-bold mb-1">Observation Report</p>
                    <h2 class="text-2xl font-medium text-[#2C3E50] tracking-wide">AI 智慧美肌觀察報告</h2>
                </div>
            </div>

            <!-- 報告內容區 -->
            <div class="flex-1 p-6 space-y-6">

                    <div class="bg-white p-4 rounded-2xl border border-[#B2B1B1]/30 shadow-sm">

                        <p class="text-lg font-semibold text-[#2C3E50]" id="detected-skin-type">分析中...</p>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border border-[#B2B1B1]/30 shadow-sm">

                        <p class="text-[11px] font-bold text-[#D4AF37] mt-1 leading-tight" id="detected-skin-need">分析中...</p>
                    </div>
                </div>

                <!-- 專業觀察與環境建議 -->
                <div class="bg-[#FBFCF8] p-5 rounded-2xl border border-[#D4AF37]/30 shadow-sm">
                    <div class="flex items-start gap-3">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="2" class="flex-shrink-0 mt-0.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        <div>
                            <p class="text-[10px] font-bold text-[#D4AF37] mb-1">專業環境防禦建議</p>
                            <p class="text-xs text-[#2C3E50] leading-relaxed font-medium" id="skin-desc">
                                載入專屬養護建議中...
                            </p>
                        </div>
                    </div>
                </div>

                <!-- 6步驟專屬養護清單 -->
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-sm font-bold text-[#2C3E50] tracking-wide">專屬肌膚養護配方</h3>

                    </div>
                    <div id="product-list" class="space-y-3"></div>
                </div>

                <!-- 底部操作列 -->
                <div class="pt-6 mt-4 border-t border-[#B2B1B1]/30 flex gap-3">
                    <button onclick="retest()" class="w-1/3 border border-[#B2B1B1] text-[#2C3E50] bg-white py-3.5 rounded-2xl text-xs font-bold tracking-wide active:scale-95 transition-transform hover:bg-[#FBFCF8]">
                        重新檢測
                    </button>
                    <button onclick="shareResult()" class="w-2/3 bg-[#D4AF37] text-white py-3.5 rounded-2xl text-xs font-bold tracking-wide shadow-md active:scale-95 transition-transform flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                        複製並分享報告
                    </button>
                </div>
                <div class="h-16 w-full flex-shrink-0"></div>
            </div>
        </div>

        <!-- 自訂安全訊息彈窗 -->
        <div id="custom-modal" class="custom-modal">
            <div class="custom-modal-content">
                <div class="w-12 h-12 bg-[#FBFCF8] border border-[#D4AF37]/30 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm">
                    <span class="text-[#D4AF37] text-xl font-bold">i</span>
                </div>
                <p id="modal-msg" class="text-[13px] leading-relaxed mb-6 font-medium tracking-wide text-[#2C3E50] whitespace-pre-line"></p>
                <button onclick="closeModal()" class="w-full bg-[#D4AF37] text-white py-3 rounded-xl text-xs font-bold tracking-widest uppercase shadow-sm active:scale-95 transition-transform">確認</button>
            </div>
        </div>
    </div>

        const video = document.getElementById('webcam');
        const appContainer = document.getElementById('app');
        const videoContainer = document.getElementById('video-container');
        let streamActive = false;
        let faceMeshConfigured = false;
        let aiCamera = null;
        
        function showModal(msg) {
            document.getElementById('modal-msg').innerText = msg;
            document.getElementById('custom-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.remove('active');
        }
        
        function updateTime() {
            const now = new Date();
            document.getElementById('time-display').innerText = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 核心：AI 臉部模型結果處理
        function onResults(results) {
            if (!appContainer.classList.contains('scanning')) return;

            const landmarksEls = document.querySelectorAll('.landmark');
            const guideFrame = document.getElementById('face-guide');

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                // 抓到臉龐，顯示追蹤點並淡化外框
                landmarksEls.forEach(el => el.classList.add('active'));
                guideFrame.classList.add('face-detected');

                const landmarks = results.multiFaceLandmarks[0];
                
                // 動態計算座標映射 (處理 object-fit: cover 與 scaleX(-1) 鏡像)
                const containerWidth = videoContainer.clientWidth;
                const containerHeight = videoContainer.clientHeight;
                const videoRatio = video.videoWidth / video.videoHeight;
                const containerRatio = containerWidth / containerHeight;
                
                let renderWidth, renderHeight, offsetX = 0, offsetY = 0;
                if (containerRatio > videoRatio) {
                    renderWidth = containerWidth;
                    renderHeight = containerWidth / videoRatio;
                    offsetY = (containerHeight - renderHeight) / 2;
                } else {
                    renderHeight = containerHeight;
                    renderWidth = containerHeight * videoRatio;
                    offsetX = (containerWidth - renderWidth) / 2;
                }

                // 座標轉換函式 (因鏡頭翻轉，X軸需反轉: 1 - x)
                const updatePoint = (id, landmarkObj) => {
                    const el = document.getElementById(id);
                    if(!el || !landmarkObj) return;
                    const x = offsetX + (1 - landmarkObj.x) * renderWidth;
                    const y = offsetY + landmarkObj.y * renderHeight;
                    el.style.left = `${x}px`;
                    el.style.top = `${y}px`;
                };

                // 對應五官特徵點 (MediaPipe 標準 Index)
                updatePoint('pt-forehead', landmarks[10]);  // 眉心
                updatePoint('pt-right-eye', landmarks[386]); // 右眼 (鏡像中為左側)
                updatePoint('pt-left-eye', landmarks[159]);  // 左眼 (鏡像中為右側)
                updatePoint('pt-nose', landmarks[4]);       // 鼻尖
                updatePoint('pt-chin', landmarks[152]);     // 下巴

            } else {
                // 未抓到臉龐時隱藏
                landmarksEls.forEach(el => el.classList.remove('active'));
                guideFrame.classList.remove('face-detected');
            }
        }

        async function initCameraAndAnalysis() {
            if (!streamActive) {
                const btn = document.getElementById('start-btn');
                btn.innerHTML = `<span class="animate-pulse">載入 AI 面部引擎中...</span>`;
                
                try {
                    // 1. 初始化相機
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'user', aspectRatio: { ideal: window.innerHeight / window.innerWidth } }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    streamActive = true;

                    // 2. 初始化 Google FaceMesh
                    if (!faceMeshConfigured) {
                        const faceMesh = new FaceMesh({locateFile: (file) => {
                            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
                        }});
                        faceMesh.setOptions({
                            maxNumFaces: 1,
                            refineLandmarks: false,
                            minDetectionConfidence: 0.5,
                            minTrackingConfidence: 0.5
                        });
                        faceMesh.onResults(onResults);

                        aiCamera = new Camera(video, {
                            onFrame: async () => {
                                if(appContainer.classList.contains('scanning')){
                                    await faceMesh.send({image: video});
                                }
                            }
                        });
                        await aiCamera.start();
                        faceMeshConfigured = true;
                    }

                    startAnalysisUI();
                } catch (err) {
                    console.error("相機或AI開啟失敗: ", err);
                    showModal("無法存取相機或載入AI。\n請確認網路與權限。");
                    btn.innerHTML = `開啟鏡頭掃描`;
                }
            } else {
                startAnalysisUI();
            }
        }

        function startAnalysisUI() {
            const cameraView = document.getElementById('camera-view');
            const reportPage = document.getElementById('report-page');
            const gpsModal = document.getElementById('gps-modal');
            const statusText = document.getElementById('main-status');
            const locationText = document.getElementById('location-text');
            const scanTips = document.getElementById('scanning-status');
            const stepText = document.getElementById('scan-step-text');

            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            gpsModal.classList.add('opacity-0', 'pointer-events-none');
            
            // 重置引導框與特徵點狀態
            document.getElementById('face-guide').classList.remove('face-detected');
            document.querySelectorAll('.landmark').forEach(el => el.classList.remove('active'));
            
            setTimeout(() => {
                locationText.innerText = '高雄市, 苓雅區';
                statusText.innerText = '正在進行 AI 微觀偵測';
                appContainer.classList.remove('results-active');
                appContainer.classList.add('scanning');
                scanTips.classList.remove('hidden');
            }, 500);

            const steps = [
                "啟動 AI 臉部輪廓精準定位...",
                "正在追蹤肌膚紋理與五官座標...",
                "鎖定 T 字部位與 U 字部位養護節點...",
                "環境分析：抓取氣象與紫外線指數...",
                "綜合評估：根據在地環境優化配方..."
            ];
            
            let stepIdx = 0;
            const stepInterval = setInterval(() => {
                if (stepIdx < steps.length) {
                    stepText.innerText = steps[stepIdx];
                    stepIdx++;
                }
            }, 1200);

            setTimeout(() => {
                clearInterval(stepInterval);
                appContainer.classList.remove('scanning');
                statusText.innerText = '掃描完成';
                scanTips.classList.add('hidden');
                
                generateResult();
                
                setTimeout(() => {
                    cameraView.classList.add('opacity-0', 'pointer-events-none');
                    reportPage.classList.add('active');
                    reportPage.scrollTop = 0;
                }, 300);

            }, 6000);
        }

        function generateResult() {
            const skinTypes = Object.keys(chiyibioDatabase);
            const detectedType = skinTypes[Math.floor(Math.random() * skinTypes.length)];
            const skinData = chiyibioDatabase[detectedType];

            document.getElementById('detected-skin-type').innerText = detectedType;
            document.getElementById('detected-skin-need').innerText = skinData.need;
            document.getElementById('skin-desc').innerText = skinData.desc;

            const productContainer = document.getElementById('product-list');
            productContainer.innerHTML = ''; 

            skinData.products.forEach((prod, index) => {
                const productHtml = `
                    <div class="bg-white border border-[#B2B1B1]/30 rounded-2xl p-4 flex gap-4 items-center shadow-sm">
                        <div class="w-8 h-8 rounded-full bg-[#D4AF37] flex items-center justify-center text-white font-bold text-xs shadow-md flex-shrink-0">
                            ${index + 1}
                        </div>
                        <div>
                            <p class="text-[10px] text-[#D4AF37] uppercase tracking-wider mb-1 font-bold">${prod.step}</p>
                            <p class="text-xs text-[#2C3E50] font-semibold leading-relaxed">${prod.name}</p>
                        </div>
                    </div>
                `;
                productContainer.insertAdjacentHTML('beforeend', productHtml);
            });
        }

        function retest() {
            const reportPage = document.getElementById('report-page');
            const cameraView = document.getElementById('camera-view');
            const statusText = document.getElementById('main-status');
            
            reportPage.classList.remove('active');
            cameraView.classList.remove('opacity-0', 'pointer-events-none');
            statusText.innerText = '系統重置中';
            
            setTimeout(() => {
                startAnalysisUI();
            }, 600);
        }

        function shareResult() {
            const skinType = document.getElementById('detected-skin-type').innerText;
            const skinNeed = document.getElementById('detected-skin-need').innerText;
            const skinData = chiyibioDatabase[skinType];
            let productsText = "";
            
            if (skinData && skinData.products) {
                skinData.products.forEach((prod, index) => {
                    productsText += `✨ 步驟 ${index + 1}：${prod.step}\n👉 推薦選用：${prod.name}\n\n`;
                });
            }
            
            const shareText = `【奇異生技 AI 智慧美肌顧問】\n\n我的微觀偵測結果：${skinType}\n核心養護訴求：${skinNeed}\n\n=== 專屬肌膚養護建議 ===\n\n${productsText}🌿 體驗專屬您的科技美肌方案，落實「最美好生活」保養哲學！`;
            
            const textArea = document.createElement("textarea");
            textArea.value = shareText;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.select();
            
            try {
                document.execCommand('copy');
                showModal("專屬養護報告已成功複製！\n您可以直接貼上並分享給好友，或儲存至備忘錄。");
            } catch (err) {
                showModal("複製失敗，請確認瀏覽器權限設定。");
            } finally {
                document.body.removeChild(textArea);
            }
        }
    </script>
